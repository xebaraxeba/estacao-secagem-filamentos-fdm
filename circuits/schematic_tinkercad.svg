<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <!-- Defs / Styles / Gradients -->
  <defs>
    <linearGradient id="arduinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878F" />
      <stop offset="100%" stop-color="#005B60" />
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A4A" />
      <stop offset="100%" stop-color="#041424" />
    </linearGradient>
    <linearGradient id="peltierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#795548" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.5" flood-color="#000" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="20" y="20" width="1160" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="40" y="55" fill="#58a6ff" font-size="22" font-weight="700">ESQUEMÁTICO ELÉTRICO E PROTOTIPAGEM TINKERCAD - ESTAÇÃO DE SECAGEM FDM</text>
  <text x="890" y="55" fill="#8b949e" font-size="14">Controle PID • I²C • MOSFET 12V</text>

  <!-- 1. MALHA LÓGICA DE BAIXA TENSÃO (5V/3.3V) -->
  <rect x="20" y="100" width="560" height="670" rx="12" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="40" y="130" fill="#58a6ff" font-size="15" font-weight="700">MALHA 1: LÓGICA DE BAIXA TENSÃO E INSTRUMENTAÇÃO (5V / 3.3V)</text>

  <!-- ARDUINO UNO BLOCK -->
  <rect x="50" y="160" width="240" height="340" rx="10" fill="url(#arduinoGrad)" stroke="#00b4d8" stroke-width="2" filter="url(#shadow)" />
  <text x="110" y="200" fill="#ffffff" font-size="18" font-weight="bold">ARDUINO UNO</text>
  <text x="120" y="220" fill="#e0f2f1" font-size="12">ATmega328P (16MHz)</text>

  <!-- Arduino Pins Left (Power & Analog) -->
  <rect x="50" y="250" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="55" y="266" fill="#fff" font-size="11" font-weight="600">5V</text>

  <rect x="50" y="280" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="55" y="296" fill="#fff" font-size="11" font-weight="600">GND</text>

  <rect x="50" y="320" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="55" y="336" fill="#fff" font-size="11" font-weight="600">A4 (SDA)</text>

  <rect x="50" y="350" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="55" y="366" fill="#fff" font-size="11" font-weight="600">A5 (SCL)</text>

  <!-- Arduino Pins Right (Digital & PWM) -->
  <rect x="230" y="250" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="245" y="266" fill="#fff" font-size="11" font-weight="600">D2 (SEL)</text>

  <rect x="230" y="280" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="245" y="296" fill="#fff" font-size="11" font-weight="600">D3 (RUN)</text>

  <rect x="230" y="340" width="60" height="22" fill="#d32f2f" rx="3" />
  <text x="235" y="356" fill="#fff" font-size="11" font-weight="700">D9 (PWM)</text>

  <rect x="230" y="380" width="60" height="22" fill="#003b3e" rx="3" />
  <text x="235" y="396" fill="#fff" font-size="11" font-weight="600">D10 (FAN)</text>

  <!-- LCD 16x2 I2C BLOCK -->
  <rect x="330" y="160" width="220" height="130" rx="8" fill="url(#lcdGrad)" stroke="#388bfd" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="345" y="175" width="190" height="55" rx="4" fill="#03111e" stroke="#238636" stroke-width="1" />
  <text x="355" y="195" fill="#39d353" font-size="11" font-family="monospace">PETG  65C  4h00m</text>
  <text x="355" y="215" fill="#39d353" font-size="11" font-family="monospace">T:24.5C RH:68% *</text>
  <text x="360" y="255" fill="#58a6ff" font-size="12" font-weight="bold">DISPLAY LCD 16x2 (I²C)</text>
  <text x="360" y="275" fill="#8b949e" font-size="10">Endereço: 0x27 (PCF8574)</text>

  <!-- BME280 SENSOR BLOCK -->
  <rect x="330" y="320" width="220" height="110" rx="8" fill="#1c2128" stroke="#a371f7" stroke-width="1.5" filter="url(#shadow)" />
  <text x="350" y="345" fill="#d2a8ff" font-size="13" font-weight="bold">SENSOR BOSCH BME280</text>
  <text x="350" y="365" fill="#8b949e" font-size="11">MEMS • Endereço I²C: 0x76</text>
  <text x="350" y="385" fill="#7ee787" font-size="11">Temp: ±0.5°C • RH: ±3%</text>
  <text x="350" y="405" fill="#79c0ff" font-size="10">Pressão Atmosférica (hPa)</text>

  <!-- BUTTONS BLOCK -->
  <rect x="50" y="540" width="240" height="200" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5" />
  <text x="70" y="565" fill="#f0f6fc" font-size="13" font-weight="bold">INTERFACE IHM (BOTÕES)</text>

  <circle cx="90" cy="610" r="16" fill="#238636" stroke="#2ea043" stroke-width="2" />
  <text x="120" y="605" fill="#f0f6fc" font-size="12" font-weight="bold">BTN_SELECT (D2)</text>
  <text x="120" y="622" fill="#8b949e" font-size="10">Alterna Perfis de Material</text>

  <circle cx="90" cy="680" r="16" fill="#1f6feb" stroke="#388bfd" stroke-width="2" />
  <text x="120" y="675" fill="#f0f6fc" font-size="12" font-weight="bold">BTN_START / STOP (D3)</text>
  <text x="120" y="692" fill="#8b949e" font-size="10">Dispara / Aborta Ciclo</text>

  <!-- 2. MALHA DE ATUAÇÃO E PWM (12V) -->
  <rect x="610" y="100" width="570" height="390" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="630" y="130" fill="#f2cc60" font-size="15" font-weight="700">MALHA 2: ATUAÇÃO TÉRMICA &amp; PWM (12V / 10A)</text>

  <!-- POWER SUPPLY 12V 10A -->
  <rect x="630" y="160" width="210" height="120" rx="8" fill="url(#powerGrad)" stroke="#f85149" stroke-width="2" filter="url(#shadow)" />
  <text x="645" y="195" fill="#fff" font-size="16" font-weight="bold">FONTE 12V 10A</text>
  <text x="645" y="218" fill="#ffcdd2" font-size="12">120W DC Estabilizada</text>
  <text x="645" y="245" fill="#fff" font-size="11">+12V | GND Unificado</text>

  <!-- MOSFET MODULE -->
  <rect x="630" y="310" width="210" height="150" rx="8" fill="#1c2128" stroke="#f0883e" stroke-width="1.5" filter="url(#shadow)" />
  <text x="645" y="335" fill="#ffab70" font-size="13" font-weight="bold">MÓDULO MOSFET</text>
  <text x="645" y="355" fill="#8b949e" font-size="11">IRLZ44N / IRF520</text>
  <rect x="645" y="375" width="45" height="20" rx="3" fill="#21262d" />
  <text x="652" y="390" fill="#58a6ff" font-size="10">GATE</text>
  <rect x="710" y="375" width="45" height="20" rx="3" fill="#21262d" />
  <text x="717" y="390" fill="#f85149" font-size="10">DRAIN</text>
  <rect x="775" y="375" width="45" height="20" rx="3" fill="#21262d" />
  <text x="780" y="390" fill="#8b949e" font-size="10">SRC</text>
  <text x="645" y="425" fill="#8b949e" font-size="10">Relay Windowing (5000ms)</text>
  <text x="645" y="445" fill="#7ee787" font-size="10">Chaveamento Suave de Potência</text>

  <!-- PELTIER MODULE -->
  <rect x="880" y="160" width="280" height="150" rx="8" fill="url(#peltierGrad)" stroke="#ff7b72" stroke-width="2" filter="url(#shadow)" />
  <text x="895" y="195" fill="#ffffff" font-size="15" font-weight="bold">PASTILHA PELTIER TEC1-12706</text>
  <text x="895" y="218" fill="#ffffff" font-size="12">12V / 6A (60W) • Efeito Seebeck</text>
  <rect x="895" y="235" width="120" height="55" fill="#b71c1c" rx="4" />
  <text x="905" y="255" fill="#fff" font-size="11" font-weight="bold">FACE QUENTE</text>
  <text x="905" y="275" fill="#ffcdd2" font-size="9">Aquecimento Convectivo</text>
  <rect x="1025" y="235" width="120" height="55" fill="#0d47a1" rx="4" />
  <text x="1035" y="255" fill="#fff" font-size="11" font-weight="bold">FACE FRIA</text>
  <text x="1035" y="275" fill="#bbdefb" font-size="9">Condensação / Ponto de Orvalho</text>

  <!-- 3. MALHA DE EXAUSTÃO E CONVECÇÃO -->
  <rect x="610" y="510" width="570" height="260" rx="12" fill="#161b22" stroke="#56d364" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="630" y="540" fill="#7ee787" font-size="15" font-weight="700">MALHA 3: CONVECÇÃO FORÇADA &amp; EXAUSTÃO</text>

  <!-- PRIMARY FAN (CONTINUOUS) -->
  <rect x="630" y="565" width="245" height="180" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5" />
  <circle cx="680" cy="640" r="30" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
  <text x="668" y="646" fill="#58a6ff" font-size="18">🌀</text>
  <text x="725" y="615" fill="#f0f6fc" font-size="13" font-weight="bold">VENTOINHA PRIMÁRIA</text>
  <text x="725" y="635" fill="#7ee787" font-size="11">Convecção Contínua (12V)</text>
  <text x="725" y="655" fill="#8b949e" font-size="10">Fixa sobre o dissipador</text>
  <text x="725" y="675" fill="#8b949e" font-size="10">Garante Biot Bi &lt; 0.1</text>
  <text x="725" y="695" fill="#58a6ff" font-size="10">Fluxo Toroidal 7.5 CFM</text>

  <!-- SECONDARY EXHAUST FAN -->
  <rect x="900" y="565" width="260" height="180" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5" />
  <circle cx="950" cy="640" r="30" fill="#21262d" stroke="#f0883e" stroke-width="2" />
  <text x="938" y="646" fill="#f0883e" font-size="18">💨</text>
  <text x="995" y="615" fill="#f0f6fc" font-size="13" font-weight="bold">EXAUSTOR SECUNDÁRIO</text>
  <text x="995" y="635" fill="#f0883e" font-size="11">D10 via Transistor 2N2222</text>
  <text x="995" y="655" fill="#8b949e" font-size="10">Controle por Histerese de RH</text>
  <text x="995" y="675" fill="#8b949e" font-size="10">Liga se RH &gt; Limite</text>
  <text x="995" y="695" fill="#7ee787" font-size="10">Expulsa vapor d'água</text>

  <!-- WIRING BUS LINES -->
  <!-- I2C SDA (A4) line -->
  <path d="M 110 330 L 310 330 L 310 200 L 330 200" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="3,3" />
  <path d="M 310 330 L 330 380" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="3,3" />
  <!-- I2C SCL (A5) line -->
  <path d="M 110 360 L 300 360 L 300 220 L 330 220" fill="none" stroke="#e3b341" stroke-width="2.5" />
  <path d="M 300 360 L 330 400" fill="none" stroke="#e3b341" stroke-width="2.5" />

  <!-- D9 PWM to MOSFET Gate -->
  <path d="M 290 350 L 590 350 L 590 385 L 645 385" fill="none" stroke="#d29922" stroke-width="3" />
  <!-- D10 to Exhaust Fan Driver -->
  <path d="M 290 390 L 580 390 L 580 635 L 900 635" fill="none" stroke="#a371f7" stroke-width="2" />

  <!-- MOSFET Drain to Peltier (-) -->
  <path d="M 732 375 L 732 280 L 880 280" fill="none" stroke="#f85149" stroke-width="3" />
  <!-- +12V Rail to Peltier (+) and Fans -->
  <path d="M 840 200 L 880 200" fill="none" stroke="#ff7b72" stroke-width="4" />
</svg>
